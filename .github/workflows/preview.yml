name: Preview build

on:
  push:
    branches: ["style-*"]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --package texshelf
      - uses: actions/upload-artifact@v4
        with:
          name: texshelf-${{ github.ref_name }}-macos-arm64
          path: |
            target/release/texshelf
            target/release/typshelf
