name: Publish crates

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::The CARGO_REGISTRY_TOKEN secret is empty or not shared with this repository"
            exit 1
          fi
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "texshelf") | .version')
          for crate in texshelf-core texshelf; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "texshelf-release (https://github.com/texshelf/texshelf)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = "200" ]; then
              echo "$crate $version is already on crates.io"
              continue
            fi
            cargo publish --locked --package "$crate"
          done
