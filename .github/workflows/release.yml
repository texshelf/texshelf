name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --package texshelf --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="texshelf-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/{texshelf,typshelf}.exe "$name/"
            7z a "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp target/${{ matrix.target }}/release/{texshelf,typshelf} "$name/"
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            texshelf-*.tar.gz
            texshelf-*.zip
            texshelf-*.sha256
          generate_release_notes: true

  # Tells homebrew-tap to write the formula for this release now instead of on
  # its next 6-hourly check. Starting a workflow in another repository needs a
  # token: a fine-grained one with "Actions: read and write" on homebrew-tap.
  homebrew:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Update the Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so the tap picks up this release on its next scheduled run."
            exit 0
          fi
          gh workflow run update.yml --repo texshelf/homebrew-tap
