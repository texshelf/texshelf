[package]
name = "texshelf"
description = "Start LaTeX and Typst projects from templates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["latex", "typst", "template", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "texshelf"
path = "src/bin/texshelf.rs"

[[bin]]
name = "typshelf"
path = "src/bin/typshelf.rs"

[dependencies]
texshelf-core = { path = "../texshelf-core", version = "0.2.1" }
anyhow.workspace = true
clap.workspace = true
clap_complete = "4"
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
toml.workspace = true
directories = "5"
console = "0.15"
dialoguer = { version = "0.11", default-features = false }
open = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tar.workspace = true
flate2.workspace = true
