[workspace]
resolver = "2"
members = ["crates/texshelf-core", "crates/texshelf-cli", "crates/texshelf-registry"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/texshelf/texshelf"
homepage = "https://tex.jjsm.science"
authors = ["Juan José Sánchez Medina"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
tar = { version = "0.4", default-features = false }
flate2 = "1"
ureq = { version = "2", features = ["native-certs"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
